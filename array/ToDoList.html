<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="bg-gradient-to-br from-cyan-300 via-blue-300 to-indigo-400 min-h-screen flex justify-center items-center">

  <div class="w-full max-w-3xl px-4">

    <!-- Card -->
    <div class="bg-white shadow-2xl rounded-2xl p-8">

      <!-- Heading -->
      <h3 class="text-3xl font-bold text-center text-gray-800 mb-6">
        <i class="fa fa-list text-blue-500"></i> Todo List
      </h3>

      <!-- Input Section -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <input type="text" placeholder="Enter Your Name" id="username"
          class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <button type="button" id="addUser"
          class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-full transition duration-300">
          <i class="fa fa-plus"></i> Add User
        </button>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-center border-collapse">
          <thead>
            <tr class="bg-gray-800 text-white">
              <th class="py-3 px-4">#</th>
              <th class="py-3 px-4">Name</th>
              <th class="py-3 px-4">Actions</th>
            </tr>
          </thead>

          <tbody id="records" class="divide-y divide-gray-200">
            <!-- Dynamic Records -->

          </tbody>
        </table>
      </div>

    </div>

  </div>

  <script src="ToDoList.js"></script>

</body>

</html>
