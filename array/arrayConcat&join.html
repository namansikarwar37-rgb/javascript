<script>
    let a = ["vikas", "mohit", "rohit"];
    let b = ["ram", "raj", 234];

    document.write(a + "<br><br>");
    document.write(b + "<br><br>")

    let c = a.concat(b); //simply joins two arrays
    document.write(c + "<br><br>");

    let d = c.join("/"); //joins arrays with '/' in between the elements
    document.write(d);
    
    </script>
