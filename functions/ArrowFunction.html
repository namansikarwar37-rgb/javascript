<script>
    // Simple function
    function abc() {
        document.write("Hello Gwalior<br>");
    }
    abc();

    // Anonymous function
    const user = function () {
        document.write("Hello User<br>");
    };
    user();

    // Arrow function
    const data = () => {
        document.write("Hello Data<br>");
    };
    data();

    // Arrow function (one line)
    const data1 = () => document.write("Hello Data1<br>");
    data1();

    // Arrow function with one parameter
    const data2 = a => document.write(a);
    data2(3);
</script>
