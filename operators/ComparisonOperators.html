<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    let a=10
    let b="10"
    
    // document.write(typeof(b))


    console.log(a == b ) //check ony value
    console.log(a === b )//check data type and value both
    console.log(a != b ) //true ko false or false ko true krta hai
    console.log(a !== b )
    console.log(a > b )
    console.log(a < b)
    console.log(a >= b)
    console.log(a <= b)

</script>
    
</body>
</html>
