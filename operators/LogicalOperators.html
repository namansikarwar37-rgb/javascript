<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age = 20;
        document.write(age > 18 && age < 30); // && mein dono conditioon true honi chaiye

        document.write("<br>");

        let marks = 30;
        document.write(marks > 25 || marks < 20); // (||) mein koi ek condition true ho toh output true hi aayga

        document.write("<br>");

        document.write(!(10 > 5)); // ! output ko ulta kr deta hai
    </script>
    
</body>
</html>
