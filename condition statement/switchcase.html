<script>
    let data = "Monday";

    switch (data) {
        case "Monday":
            document.write("Today is monday");
            break;
        case "Tuesday":
            document.write("Today is tuesday");
            break;
        case "Wed":
            document.write("Today is Wed");
            break;
        default:
            document.write("please enter a valid week day");
    }
</script>
